<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Famille IPANGA">
<title>Famille IPANGA · Gestion de financement</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1565ff; --blue-d: #0a3fb0;
    --red: #e53935; --green: #14a36a; --orange: #ff8a00;
    --purple: #7b3ff2; --teal: #00a3c4; --pink: #e91e63;
    --ink: #1c2233; --muted: #6b7288; --bg: #eef2f9; --line: #e4eaf5;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px;
    -webkit-tap-highlight-color: transparent;
  }
  .hidden { display: none !important; }
  svg.i { flex-shrink: 0; }

  /* ---------- accès ---------- */
  #auth {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background:
      radial-gradient(circle at 15% 10%, #4d8bff 0, transparent 40%),
      radial-gradient(circle at 90% 85%, #ff8a00 0, transparent 35%),
      linear-gradient(160deg, #1565ff 0%, #7b3ff2 100%);
  }
  .auth-card {
    background: #fff; border-radius: 26px; width: 100%; max-width: 390px; padding: 26px 22px 22px;
    box-shadow: 0 24px 60px rgba(10,30,90,.35); animation: pop .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .crest-wrap { display: flex; justify-content: center; margin-bottom: 4px; }
  .crest-wrap img { width: 92px; height: 92px; object-fit: contain; background: #fff; border-radius: 50%; padding: 6px; box-shadow: 0 0 0 3px #ffc107, 0 10px 24px rgba(0,0,0,.18); }
  .auth-card .fam { text-align: center; color: var(--blue); font-weight: 700; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; margin-top: 12px; }
  .auth-card h1 { font-family: var(--serif); color: var(--ink); font-size: 28px; text-align: center; margin: 2px 0 4px; }
  .auth-card .lead { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
  .field input, .field select, .field textarea { width: 100%; padding: 12px 13px; border: 1.5px solid #d8e0f0; border-radius: 13px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); outline: none; }
  .field input:focus, .field select:focus { border-color: var(--accent, var(--blue)); box-shadow: 0 0 0 4px rgba(21,101,255,.15); }
  .pwd-wrap { position: relative; }
  .pwd-wrap input { padding-right: 48px; }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; padding: 8px; color: var(--muted); }
  .auth-links { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 6px; }
  .link { background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; font-size: 13px; padding: 4px 0; }
  .notice { font-size: 13px; color: var(--muted); background: #eef4ff; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .error { color: #d32f2f; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }

  /* ---------- coque ---------- */
  header.top {
    background: linear-gradient(120deg, #1565ff, #7b3ff2); color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 14px;
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 6px 20px rgba(21,101,255,.25);
  }
  header.top .logo { width: 38px; height: 38px; border-radius: 50%; background: #fff; padding: 3px; object-fit: contain; flex-shrink: 0; }
  header.top .txt { flex: 1; min-width: 0; }
  header.top h1 { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top .sub { font-size: 12px; opacity: .85; margin-top: 1px; }
  header.top button.av { border: 2px solid #ffc107; border-radius: 50%; padding: 0; background: none; cursor: pointer; flex-shrink: 0; }
  header.top button.av img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; }

  main { padding: 16px 14px 110px; max-width: 720px; margin: 0 auto; --accent: var(--blue); }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
    display: flex; background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(20,30,70,.08);
  }
  nav.tabs button {
    flex: 1; border: 0; background: none; padding: 4px 0; font-size: 10.5px; color: var(--muted);
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600;
  }
  nav.tabs button .pill { width: 44px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; transition: background .2s; }
  nav.tabs button.active { color: var(--c); }
  nav.tabs button.active .pill { background: var(--c); color: #fff; box-shadow: 0 6px 14px -4px var(--c); }

  .fab {
    position: fixed; right: 18px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 7;
    width: 58px; height: 58px; border-radius: 50%; border: 0; color: #fff; cursor: pointer;
    background: var(--accent, #1565ff); box-shadow: 0 12px 26px -6px var(--accent, #1565ff);
    display: flex; align-items: center; justify-content: center; animation: pop .4s cubic-bezier(.2,.8,.2,1) both;
  }

  h2 { font-family: var(--serif); color: var(--ink); font-size: 26px; margin: 4px 0 12px; font-weight: 700; }
  h2 .acc { color: var(--accent, #1565ff); }
  .back { background: none; border: 0; color: var(--accent, #1565ff); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 0; margin-bottom: 4px; font-size: 14px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(21,101,255,.06); animation: fadeUp .45s ease both;
  }
  .card.accent { border-top: 4px solid var(--accent, #1565ff); }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .muted { color: var(--muted); font-size: 12.5px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .main { min-width: 0; flex: 1; display: flex; gap: 12px; align-items: center; }
  .row .title { font-weight: 700; word-break: break-word; }
  .row .amt { font-weight: 800; white-space: nowrap; text-align: right; }
  .dot-ico { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #eef4ff; color: var(--blue); margin-left: 6px; vertical-align: middle; font-weight: 700; }
  .badge.late { background: #fde8e7; color: var(--red); }
  .badge.ok { background: #e3f6ec; color: var(--green); }
  .badge.warn { background: #fff1de; color: var(--orange); }
  .alert { border-radius: 14px; padding: 11px 13px; margin-bottom: 8px; font-size: 14px; background: #fff4e5; color: #7a4a00; font-weight: 600; }
  .alert.late { background: #fdecea; color: #9b1c15; }
  .btn {
    border: 0; border-radius: 14px; padding: 13px 16px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; width: 100%;
    background: linear-gradient(135deg, var(--accent, #1565ff), var(--accent, #1565ff)); box-shadow: 0 10px 22px -10px var(--accent, #1565ff);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn.ghost { background: #fff; color: var(--accent, #1565ff); border: 1.5px solid var(--accent, #1565ff); box-shadow: none; }
  .btn.small { width: auto; padding: 8px 12px; font-size: 13px; border-radius: 11px; }
  .btn.danger { background: #fff; color: var(--red); border: 1.5px solid var(--red); box-shadow: none; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .actions .btn { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1.5px solid var(--line); background: #fff; padding: 7px 13px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .chip.on { background: var(--accent, #1565ff); color: #fff; border-color: var(--accent, #1565ff); }
  .progress { height: 10px; background: #e9eef8; border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .progress > div { height: 100%; width: var(--w, 0%); border-radius: 999px; background: linear-gradient(90deg, var(--accent, #1565ff), #7fb0ff); animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
  .empty { text-align: center; color: var(--muted); padding: 26px 10px; font-size: 14px; }
  .summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .summary .big { font-family: var(--serif); font-size: 30px; font-weight: 700; color: var(--accent, #1565ff); line-height: 1.1; }

  /* ---------- accueil ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff; border-radius: 26px; padding: 22px 20px;
    background: linear-gradient(135deg, #1565ff 0%, #7b3ff2 55%, #e91e63 130%); margin-bottom: 14px;
    box-shadow: 0 20px 40px -18px rgba(70,40,200,.6); animation: fadeUp .5s ease both;
  }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.12); }
  .hero::before { width: 220px; height: 220px; right: -70px; top: -90px; }
  .hero::after { width: 140px; height: 140px; right: 40px; bottom: -80px; background: rgba(255,193,7,.25); }
  .hero .hi { font-size: 14px; opacity: .92; position: relative; }
  .hero .name { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1.1; position: relative; }
  .hero .label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; opacity: .85; margin-top: 16px; position: relative; }
  .hero .amt { font-size: 36px; font-weight: 800; letter-spacing: -.01em; position: relative; margin-top: 2px; }
  .hero .sub { font-size: 13px; opacity: .9; position: relative; }
  .hero .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; position: relative; }
  .hero .mini div { background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px; }
  .hero .mini b { display: block; font-size: 15px; margin-top: 2px; }
  .hero .mini span { font-size: 11px; opacity: .9; text-transform: uppercase; letter-spacing: .06em; }

  .donut-wrap { display: flex; gap: 16px; align-items: center; }
  .donut-wrap > svg { width: 140px; height: 140px; flex-shrink: 0; }
  .donut-wrap circle.seg { animation: fadeIn .8s ease both; }
  .legend { flex: 1; min-width: 0; }
  .legend .li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .pc { font-weight: 700; color: var(--muted); }

  /* ---------- plus ---------- */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; cursor: pointer; text-align: left; font: inherit; color: inherit; box-shadow: 0 8px 24px rgba(21,101,255,.06); animation: fadeUp .45s ease both; }
  .tile .dot-ico { margin-bottom: 10px; }
  .tile .t { font-weight: 800; font-size: 15px; }
  .tile .s { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ---------- formulaires ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(15,22,50,.5); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
  .overlay.show { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; border-radius: 26px 26px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom)); animation: slideUp .35s cubic-bezier(.2,.8,.2,1) both; }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #d6dcea; margin: 0 auto 12px; }
  .sheet h3 { margin: 0 0 14px; font-family: var(--serif); color: var(--ink); font-size: 24px; }
  .sheet .btn { margin-top: 6px; }
  .sheet .btn.ghost { margin-top: 10px; }
  .toast { position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; max-width: 90%; text-align: center; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
  .toast.show { opacity: 1; }

  /* ---------- rapport ---------- */
  .report { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 26px 24px; font-family: 'Times New Roman', Times, serif; color: #111; }
  .report .rh { text-align: center; border-bottom: 2px solid #1565ff; padding-bottom: 10px; margin-bottom: 14px; }
  .report .rh .fam { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #555; }
  .report .rh h4 { margin: 6px 0 2px; font-size: 20px; color: #0a3fb0; }
  .report .rh .per { font-size: 14px; }
  .report h5 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #0a3fb0; margin: 16px 0 6px; border-bottom: 1px solid #dde4f2; padding-bottom: 3px; }
  .report table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .report th, .report td { border-bottom: 1px solid #ddd; padding: 5px 4px; text-align: left; }
  .report th { font-weight: 700; color: #0a3fb0; }
  .report td.r, .report th.r { text-align: right; white-space: nowrap; }
  .report tr.total td { font-weight: 700; border-top: 1px solid #111; }
  .report .sign { margin-top: 28px; display: flex; justify-content: space-between; font-size: 13px; }
  .report .sign div { width: 45%; text-align: center; border-top: 1px solid #111; padding-top: 4px; }
  .report .note { font-size: 12px; color: #666; margin-top: 12px; }

  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    header.top, nav.tabs, .no-print, .toast, .overlay, .fab { display: none !important; }
    main { padding: 0; max-width: none; }
    .report { border: 0; padding: 0; }
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes grow { from { width: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (min-width: 720px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>

<section id="auth" class="hidden">
  <div class="auth-card" id="authCard"></div>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="txt">
      <h1 id="hdrTitle"></h1>
      <div class="sub" id="hdrSub"></div>
    </div>
    <button class="av" id="hdrAvatar" aria-label="Mon compte"></button>
  </header>
  <main id="view"></main>
  <div id="fabHost"></div>
  <nav class="tabs no-print" id="nav"></nav>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const DATA_KEY = 'gestion-financement-v1';
  const AUTH_KEY = 'gf-auth-v1';
  const SESSION_KEY = 'gf-session-v1';
  const FAMILY = 'Famille IPANGA';
  const CATS_OUT = ['Dîme', 'Offrande (église)', 'Contribution famille', 'Tontine', 'Alimentation', 'Logement', 'Transport', 'Santé', 'Scolarité', 'Factures', 'Vêtements', 'Autre'];
  const CATS_IN = ['Salaire', 'Commerce', 'Aide familiale', 'Autre'];
  const CONTRIB = ['Dîme', 'Offrande (église)', 'Contribution famille'];
  const DEBT_IN = ['Emprunt reçu', 'Remboursement reçu'];
  const DEBT_OUT = ['Prêt accordé', 'Remboursement d’emprunt'];
  const COLORS = ['#1565ff', '#e53935', '#ff8a00', '#7b3ff2', '#00a3c4', '#14a36a', '#e91e63', '#ffc107', '#795548', '#607d8b', '#3f51b5', '#8bc34a'];
  const CURS = ['FC', 'USD'];
  const QUESTIONS = ['Nom de jeune fille de la mère', 'Ville où vous vous êtes mariés', 'Nom du premier animal de compagnie', 'Nom de votre école primaire'];
  const USERS = {
    taty:   { label: 'Taty IPANGA',   role: 'Père', photo: 'avatar-taty.jpg' },
    armine: { label: 'Armine IPANGA', role: 'Mère', photo: 'avatar-armine.jpg' }
  };

  const ICONS = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    down: '<path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/>',
    up: '<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>',
    dollar: '<path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
    card: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/><path d="M6 15h4"/>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
    users: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0114 0"/><circle cx="17" cy="9" r="3"/><path d="M22 21a5 5 0 00-7-4.6"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    chart: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    logout: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>'
  };
  const icon = (name, size = 20) => `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

  const defaults = {
    settings: { rate: 2300, tithe: 50, titheCur: 'USD', defaultCur: 'FC' },
    tx: [], loans: [], tontines: [], savings: []
  };

  let state = loadData();
  let auth = loadAuth();
  let session = localStorage.getItem(SESSION_KEY);
  let currentTab = 'home';
  let filterWho = 'all';
  let reportMonth = null;

  /* ================= stockage ================= */
  function normState(d) {
    const out = Object.assign(structuredClone(defaults), d || {}, { settings: Object.assign(structuredClone(defaults.settings), (d && d.settings) || {}) });
    const fix = w => (w === 'A' ? 'taty' : w === 'B' ? 'armine' : w);
    ['tx', 'loans', 'tontines', 'savings'].forEach(k => (out[k] || []).forEach(x => { x.who = fix(x.who); }));
    return out;
  }
  function normAuth(a) {
    const out = {};
    Object.keys(USERS).forEach(id => { out[id] = Object.assign({ hash: null, salt: null, qq: null, qh: null }, (a && a[id]) || {}); });
    return out;
  }
  function loadData() {
    try {
      const raw = localStorage.getItem(DATA_KEY);
      return raw ? normState(JSON.parse(raw)) : structuredClone(defaults);
    } catch (e) { return structuredClone(defaults); }
  }
  function saveData() { localStorage.setItem(DATA_KEY, JSON.stringify(state)); scheduleCloudSave(); }
  function loadAuth() {
    try { return normAuth(JSON.parse(localStorage.getItem(AUTH_KEY) || '{}')); } catch (e) { return normAuth({}); }
  }
  function saveAuth() { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); scheduleCloudSave(); }

  /* ================= synchronisation (base en ligne) ================= */
  const CLOUD_URL = 'https://xztpfvxkpahabdzkbisd.supabase.co/rest/v1/famille_store';
  const CLOUD_KEY = 'sb_publishable_UrXtxf-aJSEpApGuPVu1WQ_K7iLfdyh';
  const cloudHeaders = { apikey: CLOUD_KEY, Authorization: 'Bearer ' + CLOUD_KEY, 'Content-Type': 'application/json' };
  let cloudTimer = null;
  function scheduleCloudSave() { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 500); }
  async function pushCloud() {
    try {
      await fetch(CLOUD_URL + '?id=eq.ipanga', {
        method: 'PATCH',
        headers: { ...cloudHeaders, Prefer: 'return=minimal' },
        body: JSON.stringify({ payload: { state, auth }, updated_at: new Date().toISOString() })
      });
    } catch (e) { /* hors connexion : les données restent sur l'appareil et seront envoyées plus tard */ }
  }
  async function pullCloud() {
    try {
      const res = await fetch(CLOUD_URL + '?id=eq.ipanga&select=payload', { headers: cloudHeaders });
      if (!res.ok) return;
      const rows = await res.json();
      const p = rows[0] && rows[0].payload;
      if (p && p.state) {
        state = normState(p.state);
        auth = normAuth(p.auth);
        localStorage.setItem(DATA_KEY, JSON.stringify(state));
        localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
        if (session && USERS[session]) render(); else renderAuth('login');
      } else {
        await pushCloud();
      }
    } catch (e) { /* hors connexion : on utilise les données de l'appareil */ }
  }

  /* ================= outils ================= */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const todayStr = () => iso(new Date());
  const monthStr = () => todayStr().slice(0, 7);
  const daysBetween = (a, b) => Math.round((new Date(a + 'T00:00') - new Date(b + 'T00:00')) / 86400000);
  function addDays(s, n) { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return iso(d); }
  function addMonths(s, n) { const d = new Date(s + 'T00:00'); d.setMonth(d.getMonth() + n); return iso(d); }
  const fmtDate = s => s ? new Date(s + 'T00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
  const fmtMonth = m => new Date(m + '-01T00:00').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  function fmt(n, cur) {
    const v = Math.round((Number(n) || 0) * 100) / 100;
    const s = v.toLocaleString('fr-FR', { maximumFractionDigits: 2 });
    return cur === 'USD' ? '$ ' + s : s + ' FC';
  }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  const toUSD = (a, cur) => cur === 'USD' ? Number(a) : Number(a) / state.settings.rate;
  const toFC = (a, cur) => cur === 'FC' ? Number(a) : Number(a) * state.settings.rate;
  const userLabel = id => (USERS[id] ? USERS[id].label : '');
  const matchWho = w => filterWho === 'all' || filterWho === w;
  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  async function sha(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  const hashPwd = (salt, pwd) => sha(salt + '|' + pwd);
  const normAns = s => String(s || '').trim().toLowerCase();

  const loanPaid = l => l.payments.reduce((s, p) => s + Number(p.amount), 0);
  const loanRemaining = l => Math.max(0, Number(l.amount) - loanPaid(l));
  function loanStatus(l) {
    const rem = loanRemaining(l);
    if (rem <= 0) return { label: 'Soldé', cls: 'ok' };
    if (l.due && daysBetween(l.due, todayStr()) < 0) return { label: 'En retard', cls: 'late' };
    return { label: 'En cours', cls: 'warn' };
  }
  const tontineNext = t => (t.freq === 'mensuel' ? addMonths(t.start, t.paidCount || 0) : addDays(t.start, (t.paidCount || 0) * 7));
  const savingsTotal = s => s.deposits.reduce((a, d) => a + Number(d.amount), 0);
  const catColor = c => COLORS[Math.max(0, CATS_OUT.indexOf(c)) % COLORS.length];
  function titheFor(month) {
    const due = Number(state.settings.tithe) || 0;
    const paid = state.tx.filter(t => t.type === 'out' && t.cat === 'Dîme' && t.date.startsWith(month))
      .reduce((s, t) => s + toUSD(t.amount, t.cur), 0);
    return { due, paid, rest: Math.max(0, due - paid) };
  }

  /* ================= accès ================= */

    if (mode === 'login') {

      card.innerHTML = `${head}
        <h1>Première connexion</h1>
        <div class="notice">Créez le mot de passe de <strong>${esc(userLabel(prefill))}</strong> et une question de secours.</div>
        <form id="formAuth">
          <div class="field"><label>Identifiant</label><select id="uid">${idOpts}</select></div>
          <div class="field"><label>Nouveau mot de passe (6 caractères minimum)</label><div class="pwd-wrap"><input id="pwd" type="password" autocomplete="new-password" required>${eye('pwd')}</div></div>
          <div class="field"><label>Confirmer le mot de passe</label><div class="pwd-wrap"><input id="pwd2" type="password" autocomplete="new-password" required>${eye('pwd2')}</div></div>
          <div class="field"><label>Question de secours</label><select id="qq">${QUESTIONS.map(q => `<option>${esc(q)}</option>`).join('')}</select></div>
          <div class="field"><label>Réponse</label><input id="qa" type="text" autocomplete="off" required></div>
          <button class="btn" type="submit">Créer mon accès</button>
        </form>${err}
        <div class="auth-links"><button class="link" data-go="login">Retour à la connexion</button></div>`;
    }
    if (mode === 'forgot') {
      const acc = auth[prefill];
      card.innerHTML = `${head}
        <h1>Mot de passe oublié</h1>
        <form id="formAuth">
          <div class="field"><label>Identifiant</label><select id="uid">${idOpts}</select></div>
          ${acc && acc.hash ? `
            <div class="field"><label>${esc(acc.qq)}</label><input id="qa" type="text" autocomplete="off" required></div>
            <div class="field"><label>Nouveau mot de passe</label><div class="pwd-wrap"><input id="pwd" type="password" autocomplete="new-password" required>${eye('pwd')}</div></div>
            <div class="field"><label>Confirmer le nouveau mot de passe</label><div class="pwd-wrap"><input id="pwd2" type="password" autocomplete="new-password" required>${eye('pwd2')}</div></div>
            <button class="btn" type="submit">Réinitialiser</button>`
          : `<div class="notice">Ce compte n’a pas encore de mot de passe.</div><button class="btn" type="button" data-go="setup">Première connexion</button>`}
        </form>${err}
        <div class="auth-links"><button class="link" data-go="login">Retour à la connexion</button></div>`;
    }
    document.getElementById('auth').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    bindAuth(mode);

  function bindAuth(mode) {
    document.querySelectorAll('[data-eye]').forEach(b => b.onclick = () => {
      const el = document.getElementById(b.dataset.eye); el.type = el.type === 'password' ? 'text' : 'password';
    });
    document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
      const u = document.getElementById('uid');
      renderAuth(b.dataset.go, u ? u.value : 'taty');
    });
    const u = document.getElementById('uid');
    if (u && mode !== 'login') u.onchange = () => renderAuth(mode, u.value);
    const f = document.getElementById('formAuth');
    if (!f) return;
    f.onsubmit = async e => {
      e.preventDefault();
      const id = document.getElementById('uid').value;
      const pwd = document.getElementById('pwd') ? document.getElementById('pwd').value : '';
      const acc = auth[id];
      if (mode === 'login') {
        if (!acc.hash) return renderAuth('setup', id, 'Ce compte n’a pas encore de mot de passe.');
        if (await hashPwd(acc.salt, pwd) !== acc.hash) return renderAuth('login', id, 'Identifiant ou mot de passe incorrect.');
        return enter(id);
      }
      if (mode === 'setup') {
        const pwd2 = document.getElementById('pwd2').value;
        if (pwd.length < 6) return renderAuth('setup', id, 'Le mot de passe doit comporter au moins 6 caractères.');
        if (pwd !== pwd2) return renderAuth('setup', id, 'Les deux mots de passe ne correspondent pas.');
        const ans = document.getElementById('qa').value;
        if (!normAns(ans)) return renderAuth('setup', id, 'Indiquez une réponse à la question de secours.');
        const salt = uid();
        auth[id] = { ...acc, salt, hash: await hashPwd(salt, pwd), qq: document.getElementById('qq').value, qh: await hashPwd(salt, normAns(ans)) };
        saveAuth(); toast('Accès créé');
        return enter(id);
      }
      if (mode === 'forgot') {
        if (!acc.hash) return renderAuth('setup', id);
        if (await hashPwd(acc.salt, normAns(document.getElementById('qa').value)) !== acc.qh) return renderAuth('forgot', id, 'La réponse ne correspond pas.');
        const pwd2 = document.getElementById('pwd2').value;
        if (pwd.length < 6) return renderAuth('forgot', id, 'Le mot de passe doit comporter au moins 6 caractères.');
        if (pwd !== pwd2) return renderAuth('forgot', id, 'Les deux mots de passe ne correspondent pas.');
        auth[id] = { ...acc, hash: await hashPwd(acc.salt, pwd) }; saveAuth();
        toast('Mot de passe réinitialisé');
        return renderAuth('login', id);
      }
    };
  }

  /* ================= coque ================= */

  /* ================= accueil ================= */
  function home() {
    const m = monthStr();
    const txAll = state.tx.filter(t => matchWho(t.who));
    const solde = txAll.reduce((s, t) => s + (t.type === 'in' ? 1 : -1) * toFC(t.amount, t.cur), 0);
    const monthTx = txAll.filter(t => t.date.startsWith(m));
    const revM = monthTx.filter(t => t.type === 'in' && !DEBT_IN.includes(t.cat)).reduce((s, t) => s + toUSD(t.amount, t.cur), 0);
    const depM = monthTx.filter(t => t.type === 'out' && !DEBT_OUT.includes(t.cat)).reduce((s, t) => s + toUSD(t.amount, t.cur), 0);
    const given = state.loans.filter(l => l.dir === 'given' && matchWho(l.who)).reduce((s, l) => s + toUSD(loanRemaining(l), l.cur), 0);
    const owed = state.loans.filter(l => l.dir === 'received' && matchWho(l.who)).reduce((s, l) => s + toUSD(loanRemaining(l), l.cur), 0);

    const byCat = {};
    monthTx.filter(t => t.type === 'out' && !DEBT_OUT.includes(t.cat)).forEach(t => { byCat[t.cat] = (byCat[t.cat] || 0) + toUSD(t.amount, t.cur); });
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((s, [, v]) => s + v, 0);
    const C = 2 * Math.PI * 54;
    let acc = 0;
    const segs = entries.map(([k, v]) => {
      const dash = total ? (v / total) * C : 0;
      const el = `<circle class="seg" r="54" cx="70" cy="70" fill="none" stroke="${catColor(k)}" stroke-width="16" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-acc}"/>`;
      acc += dash;
      return el;
    }).join('');
    const legend = entries.slice(0, 6).map(([k, v]) =>
      `<div class="li"><span class="sw" style="background:${catColor(k)}"></span><span class="nm">${esc(k)}</span><span class="pc">${total ? Math.round(v / total * 100) : 0} %</span></div>`).join('')
      || '<div class="muted">Aucune dépense ce mois-ci.</div>';
    const donut = `<div class="card"><div class="muted" style="font-weight:700;color:var(--ink);margin-bottom:10px">Dépenses du mois par catégorie</div>
      <div class="donut-wrap">
        <svg viewBox="0 0 140 140"><g transform="rotate(-90 70 70)"><circle r="54" cx="70" cy="70" fill="none" stroke="#eef2f9" stroke-width="16"/>${segs}</g>
        <text x="70" y="66" text-anchor="middle" font-size="12" fill="#6b7288">Total</text>
        <text x="70" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#1c2233">$ ${Math.round(total).toLocaleString('fr-FR')}</text></svg>
        <div class="legend">${legend}</div>
      </div></div>`;

    const ti = titheFor(m);
    const titheCard = `<div class="card" style="--accent:#00a3c4">
      <div class="row" style="border:0;padding:0"><div class="main"><div><div class="title">Dîme de ${fmtMonth(m)}</div>
      <div class="muted">Versé ${fmt(ti.paid, 'USD')} sur ${fmt(ti.due, 'USD')}</div></div></div>
      <div class="amt">${ti.rest > 0 ? '<span class="neg">Reste ' + fmt(ti.rest, 'USD') + '</span>' : '<span class="pos">Payée ✓</span>'}</div></div>
      <div class="progress" style="--w:${ti.due ? Math.min(100, ti.paid / ti.due * 100) : 0}%"><div></div></div>
      <div class="actions"><button class="btn small" data-add="tx-out-dime" data-amount="${ti.rest || ''}">+ Verser la dîme</button></div></div>`;

    const contribTotals = CONTRIB.map(c => [c, monthTx.filter(t => t.type === 'out' && t.cat === c).reduce((s, t) => s + toUSD(t.amount, t.cur), 0)]);
    const contribCard = `<div class="card"><div class="muted" style="font-weight:700;color:var(--ink);margin-bottom:4px">Contributions du mois</div>
      ${contribTotals.map(([c, v]) => `<div class="row"><div class="main"><span class="dot-ico" style="background:${catColor(c)}">${icon('pen', 18)}</span><div class="title">${esc(c)}</div></div><div class="amt">${fmt(v, 'USD')}</div></div>`).join('')}</div>`;

    const alerts = [];
    state.loans.forEach(l => {
      const rem = loanRemaining(l);
      if (rem <= 0 || !l.due) return;
      const d = daysBetween(l.due, todayStr());
      const txt = l.dir === 'given' ? `${l.person} vous doit` : `Vous devez à ${l.person}`;

    const excluded = isIn ? DEBT_IN : DEBT_OUT;

      .sort((a, b) => b.date.localeCompare(a.date));
    const m = monthStr();
    const monthSum = list.filter(t => t.date.startsWith(m)).reduce((s, t) => s + toUSD(t.amount, t.cur), 0);
    const allSum = list.reduce((s, t) => s + toUSD(t.amount, t.cur), 0);
    const byMonth = {};
    list.forEach(t => { (byMonth[t.date.slice(0, 7)] ||= []).push(t); });
    const groups = Object.keys(byMonth).map(mo =>
      `<div class="card"><div class="muted" style="font-weight:800;text-transform:capitalize;margin-bottom:4px;color:var(--accent, #1565ff)">${fmtMonth(mo)}</div>${byMonth[mo].map(rowTx).join('')}</div>`).join('');
    const title = isIn ? 'Revenus' : 'Dépenses';
    let dime = '';
    if (!isIn) {
      const ti = titheFor(m);
      dime = `<div class="card" style="--accent:#00a3c4"><div class="row" style="border:0;padding:0"><div class="main"><div><div class="title">Dîme de ${fmtMonth(m)}</div><div class="muted">Versé ${fmt(ti.paid, 'USD')} sur ${fmt(ti.due, 'USD')}</div></div></div>
        <div class="amt">${ti.rest > 0 ? '<span class="neg">Reste ' + fmt(ti.rest, 'USD') + '</span>' : '<span class="pos">Payée ✓</span>'}</div></div>
        <div class="progress" style="--w:${ti.due ? Math.min(100, ti.paid / ti.due * 100) : 0}%"><div></div></div></div>`;
    }
    return `<h2>${title} <span class="acc">${isIn ? '↓' : '↑'}</span></h2>
      ${whoChips()}
      <div class="card accent"><div class="summary"><div><div class="muted">Total du mois</div><div class="big">${fmt(monthSum, 'USD')}</div><div class="muted">soit ${fmt(monthSum * state.settings.rate, 'FC')}</div></div>
        <div style="text-align:right"><div class="muted">Total enregistré</div><div style="font-weight:800;font-size:18px">${fmt(allSum, 'USD')}</div></div></div></div>
      ${dime}
      ${groups || `<div class="card empty">Aucun ${isIn ? 'revenu' : 'dépense'} enregistré.<br>Touchez le bouton <b>+</b> pour commencer.</div>`}`;
  }

  /* ================= prêts / emprunts ================= */
  function loanPage(dir) {
    const isGiven = dir === 'given';
    const loans = state.loans.filter(l => l.dir === dir && matchWho(l.who)).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    const remainingTotal = loans.reduce((s, l) => s + toUSD(loanRemaining(l), l.cur), 0);
    const row = l => {
      const st = loanStatus(l);
      const rem = loanRemaining(l);
      const pct = l.amount ? Math.min(100, (loanPaid(l) / l.amount) * 100) : 0;
      return `<div class="card">
        <div class="row" style="border:0;padding:0;cursor:pointer" data-edit="loan" data-id="${l.id}">
          <div class="main"><span class="dot-ico" style="background:var(--accent, #1565ff)">${icon(isGiven ? 'dollar' : 'card', 18)}</span>
            <div style="min-width:0"><div class="title">${esc(l.person)} <span class="badge ${st.cls}">${st.label}</span></div>
            <div class="muted">${fmtDate(l.date)}${l.due ? ' · échéance ' + fmtDate(l.due) : ''} · ${esc(userLabel(l.who))}</div></div></div>
          <div class="amt">${fmt(rem, l.cur)}<div class="muted">sur ${fmt(l.amount, l.cur)}</div></div>
        </div>
        <div class="progress" style="--w:${pct}%"><div></div></div>
        <div class="actions"><button class="btn small" data-pay="${l.id}">+ Remboursement</button></div></div>`;
    };
    return `<h2>${isGiven ? 'Prêts' : 'Emprunts'}</h2>
      ${whoChips()}
      <div class="card accent"><div class="summary"><div><div class="muted">${isGiven ? 'Sommes qui nous sont dues' : 'Sommes que nous devons'}</div><div class="big">${fmt(remainingTotal, 'USD')}</div></div>
        <div style="text-align:right"><div class="muted">Dossiers</div><div style="font-weight:800;font-size:18px">${loans.length}</div></div></div></div>
      ${loans.length ? loans.map(row).join('') : `<div class="card empty">${isGiven ? 'Aucun prêt accordé.' : 'Aucun emprunt enregistré.'}<br>Touchez le bouton <b>+</b> pour en ajouter un.</div>`}`;
  }

  /* ================= plus ================= */
  function plus() {
    const tiles = [
      ['tontines', 'Tontines', 'users', '#7b3ff2', 'Cotisations et tours'],
      ['epargne', 'Épargne', 'target', '#00a3c4', 'Projets et objectifs'],
      ['rapport', 'Rapport mensuel', 'chart', '#1565ff', 'Document à imprimer'],
      ['compte', 'Mon compte', 'user', '#e91e63', 'Mot de passe et réglages']
    ];
    return `<h2>Plus</h2>
      <div class="tiles">${tiles.map(([k, l, ic, c, s]) =>
        `<button class="tile" data-tab="${k}" style="--accent:${c}"><span class="dot-ico" style="background:${c}">${icon(ic, 20)}</span><div class="t">${l}</div><div class="s">${s}</div></button>`).join('')}</div>`;
  }

  /* ================= tontines ================= */
  function tontines() {
    const row = t => {
      const next = tontineNext(t);
      const d = daysBetween(next, todayStr());
      const members = Number(t.members) || 0;
      const paid = t.paidCount || 0;
      const pct = members ? Math.min(100, (paid / members) * 100) : 0;
      const tag = d < 0 ? '<span class="badge late">Retard</span>' : d <= 3 ? '<span class="badge warn">Bientôt</span>' : '';
      return `<div class="card">
        <div class="row" style="border:0;padding:0">
          <div class="main"><span class="dot-ico" style="background:var(--accent, #1565ff)">${icon('users', 18)}</span>
          <div style="min-width:0"><div class="title">${esc(t.name)} ${tag}</div>
          <div class="muted">${fmt(t.amount, t.cur)} · ${t.freq === 'hebdo' ? 'hebdomadaire' : 'mensuelle'} · ${esc(userLabel(t.who))}</div>
          <div class="muted">Prochaine cotisation : ${fmtDate(next)}</div></div></div>
          <div class="amt">${paid}/${members}<div class="muted">cycles</div></div>
        </div>
        <div class="progress" style="--w:${pct}%"><div></div></div>
        <div class="actions"><button class="btn small" data-tpay="${t.id}">+ Cotisation versée</button><button class="btn small ghost" data-edit="tontine" data-id="${t.id}">Modifier</button></div></div>`;
    };
    const list = state.tontines.filter(t => matchWho(t.who));
    return `<button class="back" data-tab="plus">${icon('back', 18)} Plus</button><h2>Tontines</h2>${whoChips()}
      ${list.length ? list.map(row).join('') : '<div class="card empty">Aucune tontine enregistrée.</div>'}`;
  }

  /* ================= épargne ================= */
  function epargne() {
    const list = state.savings.filter(s => matchWho(s.who));
    const row = s => {
      const total = savingsTotal(s);
      const pct = s.target ? Math.min(100, (total / s.target) * 100) : 0;
      return `<div class="card">
        <div class="row" style="border:0;padding:0">
          <div class="main"><span class="dot-ico" style="background:var(--accent, #1565ff)">${icon('target', 18)}</span>
          <div style="min-width:0"><div class="title">${esc(s.name)}</div>
          <div class="muted">${esc(userLabel(s.who))} · objectif ${fmt(s.target, s.cur)}</div></div></div>
          <div class="amt">${fmt(total, s.cur)}<div class="muted">${pct.toFixed(0)} %</div></div>
        </div>
        <div class="progress" style="--w:${pct}%"><div></div></div>
        <div class="actions"><button class="btn small" data-deposit="${s.id}">+ Dépôt</button><button class="btn small ghost" data-edit="saving" data-id="${s.id}">Modifier</button></div></div>`;
    };
    return `<button class="back" data-tab="plus">${icon('back', 18)} Plus</button><h2>Épargne et projets</h2>${whoChips()}
      ${list.length ? list.map(row).join('') : '<div class="card empty">Aucun objectif d’épargne.</div>'}`;
  }

  /* ================= compte ================= */
  function compte() {
    const u = USERS[session];
    const pw = id => `<button type="button" class="eye" data-eye="${id}" aria-label="Afficher">${icon('eye', 20)}</button>`;

      <div class="card" style="display:flex;align-items:center;gap:14px">
        <img src="${u.photo}" alt="${esc(u.label)}" style="width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid #ffc107">
        <div><div style="font-family:var(--serif);font-size:24px;font-weight:700">Bonjour ${esc(u.label)}</div>
        <div class="muted">${u.role} · ${FAMILY}</div></div>
      </div>
      <div class="card">
        <div style="font-weight:800;margin-bottom:12px">Changer le mot de passe</div>
        <div class="field"><label>Mot de passe actuel</label><div class="pwd-wrap"><input id="cpCur" type="password" autocomplete="current-password">${pw('cpCur')}</div></div>
        <div class="field"><label>Nouveau mot de passe (6 caractères minimum)</label><div class="pwd-wrap"><input id="cpNew" type="password" autocomplete="new-password">${pw('cpNew')}</div></div>
        <div class="field"><label>Confirmer le nouveau mot de passe</label><div class="pwd-wrap"><input id="cpNew2" type="password" autocomplete="new-password">${pw('cpNew2')}</div></div>
        <button class="btn" id="btnChangePwd">Enregistrer le nouveau mot de passe</button>
      </div>
      <div class="card">
        <div style="font-weight:800;margin-bottom:12px">Paramètres du foyer</div>
        <div class="field"><label>Taux de change (1 $ = ? FC)</label><input id="rate" type="number" inputmode="numeric" value="${state.settings.rate}"></div>
        <div class="field"><label>Dîme mensuelle (en $)</label><input id="tithe" type="number" inputmode="decimal" value="${state.settings.tithe}"></div>
        <button class="btn" id="btnSettings">Enregistrer</button>
      </div>
      <div class="card">
        <div style="font-weight:800;margin-bottom:6px">Sauvegarde et partage</div>
        <div class="muted" style="margin-bottom:10px">Les données restent sur cet appareil. Exportez une sauvegarde pour la transférer sur le téléphone de l’autre personne.</div>
        <div class="actions"><button class="btn" id="exportJson">Exporter la sauvegarde</button><button class="btn ghost" id="importBtn">Importer</button></div>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
      <div class="card"><button class="btn ghost" id="btnLogout">${icon('logout', 18)} Se déconnecter</button></div>
      <div class="card"><button class="btn danger" id="resetAll">Effacer les données de cet appareil</button></div>`;
  }

  /* ================= rapport ================= */
  function rapport() {
    const m = reportMonth || monthStr();
    const inM = state.tx.filter(t => t.date.startsWith(m));
    const sumBy = (type, excl) => {
      const map = {};
      inM.filter(t => t.type === type && !excl.includes(t.cat)).forEach(t => { map[t.cat] = (map[t.cat] || 0) + toUSD(t.amount, t.cur); });
      return map;
    };
    const inc = sumBy('in', DEBT_IN);
    const exp = sumBy('out', DEBT_OUT);
    const totInc = Object.values(inc).reduce((a, b) => a + b, 0);
    const totExp = Object.values(exp).reduce((a, b) => a + b, 0);
    const ti = titheFor(m);
    const given = state.loans.filter(l => l.dir === 'given').reduce((s, l) => s + toUSD(loanRemaining(l), l.cur), 0);
    const owed = state.loans.filter(l => l.dir === 'received').reduce((s, l) => s + toUSD(loanRemaining(l), l.cur), 0);
    const savings = state.savings.reduce((s, x) => s + toUSD(savingsTotal(x), x.cur), 0);
    const rowsOf = obj => Object.keys(obj).sort((a, b) => obj[b] - obj[a])
      .map(k => `<tr><td>${esc(k)}</td><td class="r">${fmt(obj[k], 'USD')}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Aucun</td></tr>';
    const contribTotal = CONTRIB.reduce((s, c) => s + (exp[c] || 0), 0);
    const now = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    return `<button class="back no-print" data-tab="plus">${icon('back', 18)} Plus</button><h2 class="no-print">Rapport mensuel</h2>
      <div class="no-print" style="display:flex;gap:8px;align-items:end;margin-bottom:12px">
        <div class="field" style="flex:1;margin:0"><label>Mois du rapport</label><input type="month" id="rMonth" value="${m}"></div>
        <button class="btn small" id="btnPrint" style="padding:13px 14px">Imprimer / PDF</button>
      </div>
      <div class="report">
        <div class="rh"><div class="fam">${FAMILY}</div><h4>Rapport financier mensuel</h4><div class="per">${fmtMonth(m)}</div></div>
        <h5>1. Synthèse</h5>
        <table>
          <tr><th>Indicateur</th><th class="r">USD</th><th class="r">FC</th></tr>
          <tr><td>Total des revenus</td><td class="r">${fmt(totInc, 'USD')}</td><td class="r">${fmt(totInc * state.settings.rate, 'FC')}</td></tr>
          <tr><td>Total des dépenses</td><td class="r">${fmt(totExp, 'USD')}</td><td class="r">${fmt(totExp * state.settings.rate, 'FC')}</td></tr>
          <tr class="total"><td>Solde du mois</td><td class="r">${fmt(totInc - totExp, 'USD')}</td><td class="r">${fmt((totInc - totExp) * state.settings.rate, 'FC')}</td></tr>
        </table>
        <div class="note">Taux de change appliqué : 1 $ = ${state.settings.rate.toLocaleString('fr-FR')} FC.</div>
        <h5>2. Revenus</h5><table><tr><th>Catégorie</th><th class="r">USD</th></tr>${rowsOf(inc)}</table>
        <h5>3. Dépenses</h5><table><tr><th>Catégorie</th><th class="r">USD</th></tr>${rowsOf(Object.fromEntries(Object.entries(exp).filter(([k]) => !CONTRIB.includes(k))))}</table>
        <h5>4. Contributions (église et famille)</h5>
        <table><tr><th>Objet</th><th class="r">USD</th></tr>
          ${CONTRIB.map(c => `<tr><td>${esc(c)}</td><td class="r">${fmt(exp[c] || 0, 'USD')}</td></tr>`).join('')}
          <tr class="total"><td>Total des contributions</td><td class="r">${fmt(contribTotal, 'USD')}</td></tr></table>
        <div class="note">Dîme du mois : versé ${fmt(ti.paid, 'USD')} sur ${fmt(ti.due, 'USD')} — ${ti.rest > 0 ? 'reste à verser ' + fmt(ti.rest, 'USD') : 'entièrement versée'}.</div>
        <h5>5. Prêts, emprunts et épargne (à la date d’édition)</h5>
        <table><tr><th>Élément</th><th class="r">USD</th></tr>
          <tr><td>Sommes dues à la famille (prêts)</td><td class="r">${fmt(given, 'USD')}</td></tr>
          <tr><td>Sommes dues par la famille (emprunts)</td><td class="r">${fmt(owed, 'USD')}</td></tr>
          <tr><td>Épargne et projets</td><td class="r">${fmt(savings, 'USD')}</td></tr></table>
        <div class="note">Document établi le ${now} à partir des données enregistrées dans l’application.</div>
        <div class="sign"><div>Établi par</div><div>Visé par</div></div>
      </div>
      <div class="no-print actions"><button class="btn ghost" id="btnCsv">Exporter les mouvements (CSV)</button></div>`;
  }

  /* ================= formulaires ================= */
  function openForm(title, fields, onSave, onDelete) {
    const sheet = document.getElementById('sheet');
    sheet.innerHTML = `<div class="grab"></div><h3>${title}</h3><form id="f">` + fields.map(fieldHtml).join('') +
      `<button class="btn" type="submit">Enregistrer</button>` +
      (onDelete ? `<button class="btn danger" type="button" id="del" style="margin-top:10px">Supprimer</button>` : '') +
      `<button class="btn ghost" type="button" id="cancel">Annuler</button></form>`;
    document.getElementById('overlay').classList.add('show');
    document.getElementById('cancel').onclick = closeForm;
    if (onDelete) document.getElementById('del').onclick = () => { if (confirm('Supprimer cet élément ?')) { onDelete(); saveData(); closeForm(); render(); toast('Supprimé'); } };
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      const data = {};
      fields.forEach(f => { data[f.name] = document.getElementById('fld_' + f.name).value; });
      const err = onSave(data);
      if (err) { toast(err); return; }
      saveData(); closeForm(); render(); toast('Enregistré');
    };
  }
  function fieldHtml(f) {
    const id = 'fld_' + f.name;
    if (f.type === 'select') {
      return `<div class="field"><label>${f.label}</label><select id="${id}">${f.options.map(([v, l]) =>
        `<option value="${esc(v)}" ${String(f.value) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input id="${id}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" ${f.required ? 'required' : ''} ${f.step ? `step="${f.step}"` : ''} ${f.inputmode ? `inputmode="${f.inputmode}"` : ''}></div>`;
  }
  function closeForm() { document.getElementById('overlay').classList.remove('show'); }

  const whoOpts = () => [['taty', USERS.taty.label], ['armine', USERS.armine.label]];
  const curOpts = () => CURS.map(c => [c, c]);

  function formTx(type, item, pre = {}) {
    const isNew = !item;
    const isIn = type === 'in';
    const cats = isIn ? CATS_IN : CATS_OUT;
    const v = item || Object.assign({ type, amount: '', cur: state.settings.defaultCur, cat: isIn ? cats[0] : 'Alimentation', date: todayStr(), note: '', who: session }, pre);
    openForm(`${isNew ? 'Nouveau' : 'Modifier le'} ${isIn ? 'revenu' : 'dépense'}`, [
      { name: 'amount', label: 'Montant', type: 'number', inputmode: 'decimal', step: '0.01', value: v.amount, required: true },
      { name: 'cur', label: 'Monnaie', type: 'select', value: v.cur, options: curOpts() },
      { name: 'cat', label: 'Catégorie', type: 'select', value: v.cat, options: cats.map(c => [c, c]) },
      { name: 'date', label: 'Date', type: 'date', value: v.date, required: true },
      { name: 'who', label: 'Qui ?', type: 'select', value: v.who, options: whoOpts() },
      { name: 'note', label: 'Note (facultatif)', type: 'text', value: v.note }
    ], data => {
      const amount = parseFloat(data.amount);
      if (!(amount > 0)) return 'Montant invalide';
      const rec = { type, amount, cur: data.cur, cat: data.cat, date: data.date, who: data.who, note: data.note.trim() };
      if (isNew) state.tx.push({ id: uid(), ...rec }); else Object.assign(item, rec);
    }, isNew ? null : () => { state.tx = state.tx.filter(t => t.id !== item.id); });
  }

  function formLoan(dir, item) {
    const isNew = !item;
    const isGiven = (item ? item.dir : dir) === 'given';
    const v = item || { dir, person: '', amount: '', cur: state.settings.defaultCur, date: todayStr(), due: '', who: session, note: '' };
    openForm(`${isNew ? 'Nouveau' : 'Modifier le'} ${isGiven ? 'prêt' : 'emprunt'}`, [
      { name: 'person', label: isGiven ? 'Personne à qui nous avons prêté' : 'Personne à qui nous devons', value: v.person, required: true },
      { name: 'amount', label: 'Montant', type: 'number', inputmode: 'decimal', step: '0.01', value: v.amount, required: true },
      { name: 'cur', label: 'Monnaie', type: 'select', value: v.cur, options: curOpts() },
      { name: 'date', label: 'Date', type: 'date', value: v.date, required: true },
      { name: 'due', label: 'Date d’échéance', type: 'date', value: v.due },
      { name: 'who', label: 'Qui ?', type: 'select', value: v.who, options: whoOpts() },
      { name: 'note', label: 'Note (facultatif)', value: v.note }
    ], data => {
      const amount = parseFloat(data.amount);
      if (!(amount > 0)) return 'Montant invalide';
      if (!data.person.trim()) return 'Indiquez la personne';
      const rec = { dir: isNew ? dir : item.dir, person: data.person.trim(), amount, cur: data.cur, date: data.date, due: data.due, who: data.who, note: data.note.trim() };
      if (isNew) {
        state.loans.push({ id: uid(), payments: [], ...rec });
        state.tx.push({
          id: uid(), type: isGiven ? 'out' : 'in', amount, cur: data.cur,
          cat: isGiven ? 'Prêt accordé' : 'Emprunt reçu', date: data.date, who: data.who,
          note: (isGiven ? 'Prêt à ' : 'Emprunt auprès de ') + data.person.trim()
        });
      } else Object.assign(item, rec);
    }, isNew ? null : () => { state.loans = state.loans.filter(l => l.id !== item.id); });
  }

  function formPayment(loan) {
    const isGiven = loan.dir === 'given';
    openForm(`Remboursement — ${esc(loan.person)}`, [
      { name: 'amount', label: `Montant (reste ${fmt(loanRemaining(loan), loan.cur)})`, type: 'number', inputmode: 'decimal', step: '0.01', value: '', required: true },
      { name: 'date', label: 'Date', type: 'date', value: todayStr(), required: true }
    ], data => {
      const amount = parseFloat(data.amount);
      if (!(amount > 0)) return 'Montant invalide';
      loan.payments.push({ id: uid(), amount, date: data.date });
      state.tx.push({
        id: uid(), type: isGiven ? 'in' : 'out', amount, cur: loan.cur,
        cat: isGiven ? 'Remboursement reçu' : 'Remboursement d’emprunt', date: data.date, who: loan.who,
        note: (isGiven ? 'Remboursement de ' : 'Remboursement à ') + loan.person
      });
    });
  }

  function formTontine(item) {
    const isNew = !item;
    const v = item || { name: '', amount: '', cur: state.settings.defaultCur, freq: 'mensuel', start: todayStr(), members: '', who: session, paidCount: 0 };
    openForm(isNew ? 'Nouvelle tontine' : 'Modifier la tontine', [
      { name: 'name', label: 'Nom du groupe', value: v.name, required: true },
      { name: 'amount', label: 'Cotisation par personne', type: 'number', inputmode: 'decimal', step: '0.01', value: v.amount, required: true },
      { name: 'cur', label: 'Monnaie', type: 'select', value: v.cur, options: curOpts() },
      { name: 'freq', label: 'Fréquence', type: 'select', value: v.freq, options: [['hebdo', 'Hebdomadaire'], ['mensuel', 'Mensuelle']] },
      { name: 'start', label: 'Date de début', type: 'date', value: v.start, required: true },
      { name: 'members', label: 'Nombre de membres (cycles)', type: 'number', inputmode: 'numeric', value: v.members, required: true },
      { name: 'who', label: 'Qui ?', type: 'select', value: v.who, options: whoOpts() }
    ], data => {
      const amount = parseFloat(data.amount), members = parseInt(data.members, 10);
      if (!(amount > 0) || !(members > 0)) return 'Vérifiez le montant et le nombre de membres';
      const rec = { name: data.name.trim(), amount, cur: data.cur, freq: data.freq, start: data.start, members, who: data.who };
      if (isNew) state.tontines.push({ id: uid(), paidCount: 0, ...rec }); else Object.assign(item, rec);
    }, isNew ? null : () => { state.tontines = state.tontines.filter(t => t.id !== item.id); });
  }

  function formSaving(item) {
    const isNew = !item;
    const v = item || { name: '', target: '', cur: state.settings.defaultCur, who: session };
    openForm(isNew ? 'Nouvel objectif' : 'Modifier l’objectif', [
      { name: 'name', label: 'Objectif (ex. terrain, scolarité, voyage)', value: v.name, required: true },
      { name: 'target', label: 'Montant visé', type: 'number', inputmode: 'decimal', step: '0.01', value: v.target, required: true },
      { name: 'cur', label: 'Monnaie', type: 'select', value: v.cur, options: curOpts() },
      { name: 'who', label: 'Qui ?', type: 'select', value: v.who, options: whoOpts() }
    ], data => {
      const target = parseFloat(data.target);
      if (!(target > 0)) return 'Montant invalide';
      const rec = { name: data.name.trim(), target, cur: data.cur, who: data.who };
      if (isNew) state.savings.push({ id: uid(), deposits: [], ...rec }); else Object.assign(item, rec);
    }, isNew ? null : () => { state.savings = state.savings.filter(s => s.id !== item.id); });
  }

  function formDeposit(s) {
    openForm('Dépôt — ' + esc(s.name), [
      { name: 'amount', label: 'Montant', type: 'number', inputmode: 'decimal', step: '0.01', value: '', required: true },
      { name: 'date', label: 'Date', type: 'date', value: todayStr(), required: true }
    ], data => {
      const amount = parseFloat(data.amount);
      if (!(amount > 0)) return 'Montant invalide';
      s.deposits.push({ id: uid(), amount, date: data.date });
    });
  }

  /* ================= export ================= */
  function download(name, content, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function exportCsv() {
    const rows = [['Date', 'Type', 'Montant', 'Monnaie', 'Catégorie', 'Qui', 'Note']];
    state.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t =>
      rows.push([t.date, t.type === 'in' ? 'Revenu' : 'Dépense', t.amount, t.cur, t.cat, userLabel(t.who), t.note]));
    const csv = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
    download('mouvements.csv', '﻿' + csv, 'text/csv;charset=utf-8');
  }

  /* ================= événements ================= */
  function bind() {
    document.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => {
      currentTab = el.dataset.tab; filterWho = 'all'; render(); window.scrollTo(0, 0);
    });
    document.querySelectorAll('[data-who]').forEach(el => el.onclick = () => { filterWho = el.dataset.who; render(); });
    document.querySelectorAll('[data-add]').forEach(el => el.onclick = () => {
      const k = el.dataset.add;
      if (k === 'tx-in') return formTx('in');
      if (k === 'tx-out') return formTx('out');
      if (k === 'tx-out-dime') return formTx('out', null, { cat: 'Dîme', cur: 'USD', amount: el.dataset.amount || '' });
      if (k === 'loan-given') return formLoan('given');
      if (k === 'loan-received') return formLoan('received');
      if (k === 'tontine') return formTontine();
      if (k === 'saving') return formSaving();
    });
    document.querySelectorAll('[data-edit]').forEach(el => el.onclick = e => {
      if (e.target.closest('button')) return;
      const kind = el.dataset.edit;
      const map = { tx: state.tx, loan: state.loans, tontine: state.tontines, saving: state.savings };
      const item = map[kind].find(x => x.id === el.dataset.id);
      if (!item) return;
      if (kind === 'tx') formTx(item.type, item);
      if (kind === 'loan') formLoan(item.dir, item);
      if (kind === 'tontine') formTontine(item);
      if (kind === 'saving') formSaving(item);
    });
    document.querySelectorAll('[data-pay]').forEach(el => el.onclick = () => {
      const l = state.loans.find(x => x.id === el.dataset.pay); if (l) formPayment(l);
    });
    document.querySelectorAll('[data-tpay]').forEach(el => el.onclick = () => {
      const t = state.tontines.find(x => x.id === el.dataset.tpay);
      if (!t) return;
      if ((t.paidCount || 0) >= t.members) { toast('Tous les cycles sont versés'); return; }
      t.paidCount = (t.paidCount || 0) + 1;
      state.tx.push({ id: uid(), type: 'out', amount: t.amount, cur: t.cur, cat: 'Tontine', date: todayStr(), who: t.who, note: 'Tontine : ' + t.name });
      saveData(); render(); toast('Cotisation enregistrée');
    });
    document.querySelectorAll('[data-deposit]').forEach(el => el.onclick = () => {
      const s = state.savings.find(x => x.id === el.dataset.deposit); if (s) formDeposit(s);
    });
    document.querySelectorAll('[data-eye]').forEach(b => b.onclick = () => {
      const el = document.getElementById(b.dataset.eye); el.type = el.type === 'password' ? 'text' : 'password';
    });

    const rm = document.getElementById('rMonth');
    if (rm) rm.onchange = () => { reportMonth = rm.value; render(); };
    const bp = document.getElementById('btnPrint');
    if (bp) bp.onclick = () => window.print();
    const bc = document.getElementById('btnCsv');
    if (bc) bc.onclick = exportCsv;

    const cp = document.getElementById('btnChangePwd');
    if (cp) cp.onclick = async () => {
      const acc = auth[session];
      const cur = document.getElementById('cpCur').value;
      const n1 = document.getElementById('cpNew').value;
      const n2 = document.getElementById('cpNew2').value;
      if (await hashPwd(acc.salt, cur) !== acc.hash) return toast('Mot de passe actuel incorrect');
      if (n1.length < 6) return toast('Le nouveau mot de passe doit comporter au moins 6 caractères');
      if (n1 !== n2) return toast('Les deux nouveaux mots de passe ne correspondent pas');
      acc.hash = await hashPwd(acc.salt, n1); saveAuth();
      ['cpCur', 'cpNew', 'cpNew2'].forEach(i => { document.getElementById(i).value = ''; });
      toast('Mot de passe modifié');
    };
    const bs = document.getElementById('btnSettings');
    if (bs) bs.onclick = () => {
      const r = parseFloat(document.getElementById('rate').value);
      const t = parseFloat(document.getElementById('tithe').value);
      if (!(r > 0) || !(t >= 0)) return toast('Valeurs invalides');
      state.settings.rate = r; state.settings.tithe = t; saveData(); render(); toast('Paramètres enregistrés');
    };
    const ex = document.getElementById('exportJson');
    if (ex) ex.onclick = () => download('sauvegarde-financement-' + todayStr() + '.json', JSON.stringify(state, null, 2), 'application/json');
    const ib = document.getElementById('importBtn');
    if (ib) ib.onclick = () => document.getElementById('importFile').click();
    const inp = document.getElementById('importFile');
    if (inp) inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          if (!confirm('Remplacer les données actuelles par cette sauvegarde ?')) return;
          state = Object.assign(structuredClone(defaults), data, { settings: Object.assign(structuredClone(defaults.settings), data.settings || {}) });
          saveData(); render(); toast('Sauvegarde importée');
        } catch (e) { toast('Fichier invalide'); }
      };
      r.readAsText(f);
    };
    const lo = document.getElementById('btnLogout');
    if (lo) lo.onclick = logout;
    const ra = document.getElementById('resetAll');
    if (ra) ra.onclick = () => {
      if (confirm('Effacer toutes les données de cet appareil ? (les accès restent)')) { state = structuredClone(defaults); saveData(); render(); toast('Données effacées'); }
    };
  }

  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeForm(); });

  if (session && USERS[session]) showApp();
  else renderAuth('login');
  pullCloud();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
